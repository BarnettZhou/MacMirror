<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAN Mirror 管理</title>
<style>
:root{font:16px system-ui,sans-serif;color:#222;background:#f4f5f7}*{box-sizing:border-box}body{max-width:720px;margin:0 auto;padding:32px 20px}section{background:#fff;border:1px solid #ddd;border-radius:8px;padding:20px;margin:16px 0}h1{margin:0 0 24px}h2{font-size:18px;margin:0 0 16px}code{font-size:2rem;letter-spacing:.3rem}label{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #eee}label:last-of-type{border-bottom:0}select,button{font:inherit;padding:8px 12px}button{cursor:pointer}.status{color:#555}.error{color:#b42318;min-height:1.5em}
</style>
</head>
<body>
<h1>LAN Mirror</h1>
<section><h2>连接认证</h2><p>客户端认证码：<code id="code">----</code></p><p id="state" class="status">正在读取状态…</p><button id="disconnect" type="button">下线客户端</button></section>
<section><h2>虚拟副屏</h2><label>启用虚拟屏幕 <input id="enabled" type="checkbox"></label><label>分辨率 <select id="resolution"></select></label><p class="status">较低分辨率会让副屏中的文字显得更大，但画面会更柔和。</p><p id="message" class="error" role="status"></p></section>
<script>
const code=document.querySelector('#code'),state=document.querySelector('#state'),enabled=document.querySelector('#enabled'),resolution=document.querySelector('#resolution'),message=document.querySelector('#message'),disconnect=document.querySelector('#disconnect');
let current=null,updating=false;
async function refresh(){if(updating)return;const response=await fetch('/api/status');const status=await response.json();current=status;code.textContent=status.code;state.textContent=status.connected?`已连接：${status.device.address}`:'当前没有客户端连接';const values=status.resolutions||[];if([...resolution.options].map(option=>option.value).join(',')!==values.join(',')){resolution.replaceChildren(...values.map(value=>new Option(value,value)));}if(status.backendError)message.textContent=`后端读取失败：${status.backendError}`;const display=status.virtualDisplay;enabled.checked=Boolean(display?.connected);if(display?.resolution&&[...resolution.options].some(option=>option.value===display.resolution))resolution.value=display.resolution;}
async function update(body){updating=true;message.textContent='正在应用…';try{const response=await fetch('/api/display',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const result=await response.json();if(!result.ok)throw new Error(result.error);message.textContent='已应用';await refresh();}catch(error){message.textContent=`应用失败：${error.message}`}finally{updating=false}}
enabled.onchange=()=>update({connected:enabled.checked});resolution.onchange=()=>update({resolution:resolution.value});disconnect.onclick=async()=>{await fetch('/api/disconnect',{method:'POST'});refresh()};refresh();setInterval(refresh,2000);
</script>
</body>
</html>
